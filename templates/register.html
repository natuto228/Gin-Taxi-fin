<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - Gin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">

<a href="/" class="header-back">← На главную</a>

<div class="login-card">
    <div class="text-center">
        <div class="login-logo-circle">R</div>
        <h3 class="login-title">Регистрация</h3>
    </div>
    
    <form id="registerForm">
        <label class="login-label">ФИО</label>
        <input type="text" id="fullname" class="login-input" required>
        
        <label class="login-label">Телефон</label>
        <input type="tel" id="phone" class="login-input" required>
        
        <label class="login-label">Email</label>
        <input type="email" id="email" class="login-input" required>
        
        <label class="login-label">Пароль</label>
        <input type="password" id="password" class="login-input" required>
        
        <button type="submit" class="login-btn">Зарегистрироваться</button>
    </form>
    
    <div class="login-test-info">
        <a href="/login-user">Уже есть аккаунт? Войти</a>
    </div>
</div>

<script src="/static/script.js"></script>

</body>
</html>
