<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gin Taxi - Заказ такси</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://api-maps.yandex.ru/2.1/?lang=ru_RU" type="text/javascript"></script>
</head>
<body>

<div class="page-container">
    
    <header class="header">
        <div class="user-status">
            <i class="fas fa-user-circle"></i>
            <span id="userNameHeader">
                <a href="/login-user">Войти</a>
            </span>
        </div>
    </header>
    
    <div class="main-content">
        
        <aside class="sidebar">
            
            <div class="logo-image-card" onclick="window.location.href='/'">
                <img src="/static/gin_photo.jpg" alt="Gin">
                <p>Gin Taxi</p>
            </div>
            
            <div class="action-card" id="phoneOrderBtn">
                <h3>Заказ по телефону</h3>
            </div>
            
            <div class="action-card" id="orderBtn">
                <h3>Выбрать тариф</h3>
            </div>
            
            <div class="action-card" id="commentBtn">
                <h3>Комментарий водителю</h3>
            </div>
            
            <div class="driver-card" id="driverLoginBtn">
                <h3>Войти в профиль</h3>
                <p>Работа в такси</p>
            </div>
            
        </aside>
        
        <div class="map-container">
            <div id="map"></div>
        </div>
    </div>
    
    <footer class="footer">
        <div class="footer-content">
            <span>Ибрагимова Ф.Н.</span>
            <span>Учебный проект</span>
            <span>Gin Taxi 2026</span>
        </div>
    </footer>
</div>

<div id="orderModal" class="modal-custom">
    <div class="modal-content">
        <h3>Заказ такси</h3>
        <hr>
        <input type="text" id="orderName" placeholder="ФИО">
        <input type="tel" id="orderPhone" placeholder="Телефон">
        <input type="text" id="orderPickup" placeholder="Адрес подачи">
        <input type="text" id="orderDropoff" placeholder="Адрес назначения">
        <select id="orderTariff">
            <option value="Эконом (25 руб/км)">Эконом - 25 руб/км</option>
            <option value="Комфорт (35 руб/км)">Комфорт - 35 руб/км</option>
            <option value="Бизнес (50 руб/км)">Бизнес - 50 руб/км</option>
        </select>
        <div id="pricePreview" class="price-preview"></div>
        <button class="btn-primary" id="submitOrderBtn">Заказать такси</button>
        <button class="btn-secondary" onclick="closeOrderModal()">Отмена</button>
    </div>
</div>

<div id="commentModal" class="modal-custom">
    <div class="modal-content">
        <h3>Комментарий водителю</h3>
        <textarea id="driverComment" rows="4" placeholder="Ваши пожелания..."></textarea>
        <button class="btn-primary" id="sendCommentBtn">Отправить</button>
        <button class="btn-secondary" onclick="closeCommentModal()">Отмена</button>
    </div>
</div>

<script src="/static/script.js"></script>

</body>
</html>
