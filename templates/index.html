<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gin Taxi</title>
    <link href="https://fonts.cdnfonts.com/css/southghetto" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://api-maps.yandex.ru/2.1/?lang=ru_RU&apikey=087a8bd0-4f5b-4b21-8e12-646e0b27a2c4" type="text/javascript"></script>
</head>
<body>

<div class="page-container">

    <header class="header">
        <div class="logo">Gin Taxi</div>
        <div class="user-status" id="userStatus">
            <a href="/login-user" id="authLink">Войти</a>
        </div>
    </header>
    
    <div class="main-content">
        
        <div class="sidebar">
            <div class="logo-card">
                <img src="/static/gin_photo.jpg" alt="Gin">
                <p>Gin Taxi</p>
            </div>
            <div class="btn-action" onclick="makePhoneCall()">
                <h3>Заказ по телефону</h3>
            </div>
            <div class="btn-action" onclick="openOrderModal()">
                <h3>Выбрать тариф</h3>
            </div>
            <div class="btn-action" onclick="openCommentModal()">
                <h3>Комментарий водителю</h3>
            </div>
            <div class="btn-driver" onclick="window.location.href='/login'">
                <h3>Войти в профиль</h3>
                <p>Работа в такси</p>
            </div>
        </div>
        
        <div class="map-area">
            <div id="map"></div>
        </div>
        
    </div>
    
    <footer class="footer">
        Ибрагимова Ф.Н. | Учебный проект | Gin Taxi 2026
    </footer>
    
</div>

<!-- МОДАЛЬНЫЕ ОКНА -->
<div id="orderModal" class="modal">
    <h3>Заказ такси</h3>
    <input type="text" id="orderName" placeholder="ФИО">
    <input type="tel" id="orderPhone" placeholder="Телефон">
    <input type="text" id="orderPickup" placeholder="Адрес подачи">
    <input type="text" id="orderDropoff" placeholder="Адрес назначения">
    <select id="orderTariff">
        <option>Эконом - 25 руб/км</option>
        <option>Комфорт - 35 руб/км</option>
        <option>Бизнес - 50 руб/км</option>
    </select>
    <div id="pricePreview"></div>
    <button onclick="submitOrder()">Заказать такси</button>
    <button onclick="closeOrderModal()" class="btn-gray">Отмена</button>
</div>

<div id="commentModal" class="modal">
    <h3>Комментарий водителю</h3>
    <textarea id="driverComment" rows="3" placeholder="Ваши пожелания..."></textarea>
    <button onclick="sendComment()">Отправить</button>
    <button onclick="closeCommentModal()" class="btn-gray">Отмена</button>
</div>

<div id="loginModal" class="modal">
    <h3>Вход пользователя</h3>
    <input type="email" id="loginEmail" placeholder="Email">
    <input type="password" id="loginPassword" placeholder="Пароль">
    <button onclick="loginUser()">Войти</button>
    <button onclick="closeLoginModal()" class="btn-gray">Отмена</button>
    <div class="modal-link"><a href="#" onclick="closeLoginModal(); showRegisterModal();">Нет аккаунта? Регистрация</a></div>
</div>

<div id="registerModal" class="modal">
    <h3>Регистрация</h3>
    <input type="text" id="regName" placeholder="ФИО">
    <input type="tel" id="regPhone" placeholder="Телефон">
    <input type="email" id="regEmail" placeholder="Email">
    <input type="password" id="regPassword" placeholder="Пароль">
    <button onclick="registerUser()">Зарегистрироваться</button>
    <button onclick="closeRegisterModal()" class="btn-gray">Отмена</button>
    <div class="modal-link"><a href="#" onclick="closeRegisterModal(); showLoginModal();">Уже есть аккаунт? Войти</a></div>
</div>

<div id="profileModal" class="modal" style="width:450px;">
    <h3>Мой профиль</h3>
    <div id="profileInfo"></div>
    <div id="ordersHistory"></div>
    <button onclick="logout()" class="logout-red">Выйти</button>
    <button onclick="closeProfileModal()" class="btn-gray">Закрыть</button>
</div>

<div id="overlay" class="overlay" onclick="closeAllModals()"></div>

<script src="/static/script.js"></script>

</body>
</html>
