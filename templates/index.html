<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Gin Taxi - Тест кнопок</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; }
        button { margin: 10px; padding: 10px 20px; font-size: 16px; cursor: pointer; background: #87CEFA; border: none; border-radius: 5px; }
        .modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border: 1px solid #ccc; z-index: 1000; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; }
    </style>
</head>
<body>

<h1>Gin Taxi - Тест кнопок</h1>

<button id="orderBtn">Выбрать тариф</button>
<button id="phoneOrderBtn">Заказ по телефону</button>
<button id="commentBtn">Комментарий водителю</button>
<button id="driverLoginBtn">Войти в профиль</button>

<!-- Модальное окно заказа -->
<div id="orderModal" class="modal">
    <h3>Заказ такси</h3>
    <input type="text" placeholder="ФИО" style="display:block; margin:10px 0;"><br>
    <button id="submitOrderBtn">Заказать</button>
    <button onclick="closeOrderModal()">Отмена</button>
</div>

<!-- Модальное окно комментария -->
<div id="commentModal" class="modal">
    <h3>Комментарий водителю</h3>
    <textarea rows="3" cols="30" id="driverComment" placeholder="Ваши пожелания..."></textarea><br>
    <button id="sendCommentBtn">Отправить</button>
    <button onclick="closeCommentModal()">Отмена</button>
</div>

<div id="overlay" class="overlay" onclick="closeOrderModal(); closeCommentModal();"></div>

<script>
    // Функции
    function openOrderModal() { document.getElementById('orderModal').style.display = 'block'; document.getElementById('overlay').style.display = 'block'; }
    function closeOrderModal() { document.getElementById('orderModal').style.display = 'none'; document.getElementById('overlay').style.display = 'none'; }
    function openCommentModal() { document.getElementById('commentModal').style.display = 'block'; document.getElementById('overlay').style.display = 'block'; }
    function closeCommentModal() { document.getElementById('commentModal').style.display = 'none'; document.getElementById('overlay').style.display = 'none'; }
    function makePhoneCall() { alert('Звонок по телефону'); }
    function submitOrder() { alert('Заказ оформлен'); closeOrderModal(); }
    function sendComment() { alert('Комментарий отправлен: ' + document.getElementById('driverComment').value); closeCommentModal(); }
    function goToLogin() { alert('Переход на страницу входа'); }

    // Назначаем кнопки
    document.getElementById('orderBtn').onclick = openOrderModal;
    document.getElementById('phoneOrderBtn').onclick = makePhoneCall;
    document.getElementById('commentBtn').onclick = openCommentModal;
    document.getElementById('driverLoginBtn').onclick = goToLogin;
    document.getElementById('submitOrderBtn').onclick = submitOrder;
    document.getElementById('sendCommentBtn').onclick = sendComment;

    // Делаем функции глобальными для кнопок "Отмена"
    window.closeOrderModal = closeOrderModal;
    window.closeCommentModal = closeCommentModal;
</script>

</body>
</html>
