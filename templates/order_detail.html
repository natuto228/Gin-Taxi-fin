<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Детали заказа - Gin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container mt-4">
    <h1>Детали заказа</h1>
    <div class="card">
        <div class="card-body">
            <p><strong>Откуда:</strong> {{order.pickup_address}}</p>
            <p><strong>Куда:</strong> {{order.dropoff_address}}</p>
            <p><strong>Тариф:</strong> {{order.tariff}}</p>
            <p><strong>Цена:</strong> {{order.price}} ₽</p>
            <p><strong>Статус:</strong> <span id="status">{{order.status}}</span></p>
        </div>
    </div>
    
    <div id="ratingBlock" style="display:none; margin-top: 20px;">
        <div class="card">
            <div class="card-body">
                <h4>Оцените поездку</h4>
                <div class="stars">
                    <span data-rating="1">★</span>
                    <span data-rating="2">★</span>
                    <span data-rating="3">★</span>
                    <span data-rating="4">★</span>
                    <span data-rating="5">★</span>
                </div>
                <textarea id="review" class="form-control mt-2" rows="3" placeholder="Ваш отзыв"></textarea>
                <button class="btn btn-primary mt-2" id="submitReviewBtn">Отправить</button>
            </div>
        </div>
    </div>
    
    <div class="mt-3">
        <button class="btn btn-success" id="simulatePaymentBtn">Оплатить (тест)</button>
        <a href="/" class="btn btn-secondary">На главную</a>
    </div>
</div>

<script src="/static/script.js"></script>
</body>
</html>
