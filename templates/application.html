<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анкета - Gin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">

<div class="login-card">
    <div class="text-center">
        <div class="login-logo-circle">A</div>
        <h3 class="login-title">Анкета для связи</h3>
    </div>
    
    <form id="applicationForm">
        <label class="login-label">ФИО</label>
        <input type="text" id="appFullname" class="login-input" required>
        
        <label class="login-label">Телефон</label>
        <input type="tel" id="appPhone" class="login-input" required>
        
        <label class="login-label">Email</label>
        <input type="email" id="appEmail" class="login-input" required>
        
        <label class="login-label">Роль</label>
        <select id="appRole" class="login-input">
            <option value="driver">Водитель такси</option>
            <option value="passenger">Пассажир</option>
        </select>
        
        <button type="submit" class="login-btn">Отправить</button>
    </form>
    
    <div class="login-test-info">
        <a href="/login">Вернуться ко входу</a>
    </div>
</div>

<script src="/static/script.js"></script>

</body>
</html>
