<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход водителя - Gin</title>
    <link href="https://fonts.cdnfonts.com/css/southghetto" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">

<a href="/" class="header-back">← На главную</a>

<div class="login-card">
    <div class="text-center">
        <div class="login-logo-circle">D</div>
        <h3 class="login-title">Вход водителя</h3>
        <p class="text-muted" style="font-size: 12px; margin-bottom: 20px;">Тестовый режим — любой логин и пароль</p>
    </div>
    
    <button id="driverTestLogin" class="login-btn">Войти в кабинет</button>
    
    <div class="login-test-info" style="margin-top: 15px; font-size: 11px;">
        <span>Тестовый вход (любые данные)</span>
    </div>
</div>

<script>
    document.getElementById('driverTestLogin').onclick = function() {
        localStorage.setItem('driverLoggedIn', 'true');
        window.location.href = '/driver-dashboard';
    };
</script>

</body>
</html>
