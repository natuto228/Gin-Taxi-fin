<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кабинет водителя - Gin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">Gin Taxi</a>
        <a href="/" class="btn btn-outline-light btn-sm">Выйти</a>
    </div>
</nav>

<div class="driver-container">
    <div class="row">
        <div class="col-md-4">
            <div class="card text-center">
                <div class="card-body">
                    <i class="fas fa-user-shield fa-4x mb-3" style="color:#87CEFA;"></i>
                    <h4>Водитель</h4>
                    <button id="statusBtn" class="btn btn-success w-100 mb-3">Онлайн</button>
                    <hr>
                    <h3 id="earnings">0 ₽</h3>
                    <p class="text-muted">Заработано сегодня</p>
                </div>
            </div>
        </div>
        
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h5>Новые заказы</h5>
                </div>
                <div class="card-body" id="ordersList">
                    <div class="alert alert-info">Загрузка...</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/static/script.js"></script>

<script>
    let isOnline = true;
    let earnings = 0;
    
    const statusBtn = document.getElementById('statusBtn');
    if (statusBtn) {
        statusBtn.onclick = function() {
            isOnline = !isOnline;
            statusBtn.textContent = isOnline ? 'Онлайн' : 'Офлайн';
            statusBtn.className = isOnline ? 'btn btn-success w-100 mb-3' : 'btn btn-danger w-100 mb-3';
        };
    }
</script>

</body>
</html>
