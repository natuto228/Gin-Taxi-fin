<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кабинет водителя - Gin Taxi</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="driver-page">

    <div class="navbar-custom">
        <a href="/" class="brand">Gin Taxi</a>
        <a href="/" class="logout-btn" onclick="localStorage.removeItem('driverLoggedIn')">Выйти</a>
    </div>

    <div class="stats-grid">
        <div class="stats-card">
            <div class="avatar">
                <i class="fas fa-user-shield"></i>
            </div>
            <h3>Водитель</h3>
            <p class="role-label">Gin Taxi</p>
            <p class="car-info">Toyota Camry A123BC</p>
            <button id="statusBtn" class="status-btn online">Онлайн</button>
            <div class="earnings" id="earnings">0 ₽</div>
            <div class="earnings-label">Заработано сегодня</div>
        </div>

        <div class="orders-card">
            <div class="card-title">Новые заказы</div>
            <div id="ordersList">
                <div class="no-orders">Загрузка...</div>
            </div>
        </div>
    </div>

    <div class="history-card">
        <div class="card-title">История выполненных заказов</div>
        <div id="historyList">
            <div class="no-orders">Загрузка...</div>
        </div>
    </div>

    <script src="/static/script.js"></script>

</body>
</html>
