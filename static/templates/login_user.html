<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход пользователя - Gin</title>
    <link href="https://fonts.cdnfonts.com/css/southghetto" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">

<a href="/" class="header-back">← На главную</a>

<div class="login-card">
    <div class="text-center">
        <div class="login-logo-circle">U</div>
        <h3 class="login-title">Вход пользователя</h3>
    </div>
    
    <form id="loginUserForm">
        <label class="login-label">Email</label>
        <input type="email" id="email" class="login-input" required>
        
        <label class="login-label">Пароль</label>
        <input type="password" id="password" class="login-input" required>
        
        <button type="submit" class="login-btn">Войти</button>
    </form>
    
    <div class="login-test-info">
        <a href="/register">Нет аккаунта? Зарегистрироваться</a>
    </div>
</div>

<script src="/static/script.js"></script>

</body>
</html>
