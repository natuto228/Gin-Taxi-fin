<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой профиль - Gin</title>
    <link href="https://fonts.cdnfonts.com/css/southghetto" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">Gin</a>
        <div>
            <span class="text-white me-3" id="userNameDisplay"></span>
            <a href="/" class="btn btn-outline-light btn-sm" onclick="localStorage.clear()">Выйти</a>
        </div>
    </div>
</nav>

<div class="profile-container">
    <div class="row">
        <div class="col-md-4">
            <div class="profile-card">
                <div class="profile-avatar">👤</div>
                <h4 id="userFullname" class="profile-name"></h4>
                <p class="profile-role">Пассажир</p>
                <hr>
                <div class="profile-stats">
                    <div class="stat-number" id="totalOrders">0</div>
                    <p class="stat-label">Всего поездок</p>
                </div>
                <a href="/" class="profile-order-btn">Заказать такси</a>
            </div>
        </div>
        
        <div class="col-md-8">
            <div class="profile-orders-card">
                <h5 class="profile-orders-title">История моих заказов</h5>
                <div id="ordersHistory">
                    <div class="profile-loading">Загрузка...</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/static/script.js"></script>

</body>
</html>
